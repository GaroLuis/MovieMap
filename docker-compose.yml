services:

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: moviemap-backend
    ports:
      - "8080:8080"
    volumes:
      - ./apps/backend:/app
      - gradle_cache:/root/.gradle
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - neo4j
      - redis
      - rabbitmq
    networks:
      - moviemap-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: moviemap-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - moviemap-network

  neo4j:
    image: neo4j:5-community
    container_name: moviemap-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - moviemap-network

  redis:
    image: redis:7-alpine
    container_name: moviemap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - moviemap-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: moviemap-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - moviemap-network

networks:
  moviemap-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  rabbitmq_data:
  gradle_cache:
